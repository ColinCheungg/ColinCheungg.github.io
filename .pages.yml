# Pages CMS configuration — https://pagescms.org/docs/configuration/
#
# Authoring flow (works from a phone, no git, no VS Code):
#   1. Open https://app.pagescms.org/ and sign in with GitHub.
#   2. Install the Pages CMS GitHub App on ColinCheungg/ColinCheungg.github.io.
#   3. Pick the repo — this file gives you a form for every post.
#
# A post becomes visible on the blog as soon as it has a `date` and some body
# text. blog/index.json is then regenerated by .github/workflows/blog-index.yml.

media:
  input: profile_images
  output: /profile_images

content:
  - name: posts
    label: Blog posts
    type: collection
    path: blog/posts
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: summary
        label: Summary (optional, shown under the title in the list)
        type: text

      - name: draft
        label: Draft (hidden from the blog list)
        type: boolean
        default: false

      # Rich text is a WYSIWYG editor that stores Markdown.
      # If you write a lot of fenced code blocks and it mangles them, change
      # this field to `type: code` — you then get a plain Markdown editor.
      - name: body
        label: Content
        type: rich-text

  - name: plan
    label: Writing plan
    type: file
    path: blog/plan.json
    fields:
      - name: title
        label: Title
        type: string

      - name: description
        label: Description
        type: text

      - name: items
        label: Planned posts (in order)
        type: object
        list: true
        fields:
          - name: slug
            label: Slug (must equal the .md filename)
            type: string
          - name: title
            label: Title
            type: string
