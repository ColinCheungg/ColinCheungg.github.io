<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/blog.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="page-blog-post">
    <div class="reading-progress" aria-hidden="true"><span id="reading-progress-fill"></span></div>

    <div class="container container--narrow">
        <nav class="site-nav" aria-label="Site">
            <a href="../index.html">Home</a>
            <span class="site-nav-sep" aria-hidden="true">·</span>
            <a href="../blog.html">Blog</a>
        </nav>

        <div id="loading" class="loading">Loading article...</div>

        <article id="article-container" hidden>
            <header class="article-head">
                <a class="back-link" href="../blog.html">← Back to Blog</a>
                <h1 id="article-title" class="article-title"></h1>
                <div class="article-meta">
                    <span id="article-date"></span>
                    <span class="sep" id="article-sep" hidden></span>
                    <span id="article-reading" hidden></span>
                </div>
            </header>

            <div id="article-content" class="article-content"></div>

            <footer class="article-foot">
                <a class="back-link" href="../blog.html">← Back to Blog</a>
            </footer>
        </article>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postFile = urlParams.get('post');

        // Any filename inside blog/posts/ is allowed (ASCII slugs recommended,
        // but a Chinese filename works too). Only path separators are rejected
        // so the request can never escape the posts folder.
        function isSafeSlug(value) {
            return Boolean(value) && !/[/\\]/.test(value) && value !== '.' && value !== '..';
        }

        // Frontmatter dates may be ISO (2026-10-19) or free text. ISO values are
        // normalised to "October 19, 2026" so the article header matches the
        // blog list, which is formatted by scripts/build_index.py.
        function formatDate(value) {
            const ts = Date.parse(value);
            if (Number.isNaN(ts)) return value;
            return new Date(ts).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'UTC'
            });
        }

        // Rough reading time: CJK characters at ~400/min, latin words at ~200/min.
        function readingTime(text) {
            const cjk = (text.match(/[\u3400-\u9fff]/g) || []).length;
            const words = text
                .replace(/[\u3400-\u9fff]/g, ' ')
                .split(/\s+/)
                .filter(Boolean).length;
            const minutes = Math.max(1, Math.round(cjk / 400 + words / 200));
            return minutes + ' min read';
        }

        function showError(message) {
            const loading = document.getElementById('loading');
            loading.className = 'error-message';
            loading.innerHTML =
                '<p>' + message + '</p>' +
                '<a href="../blog.html">← Back to Blog</a>';
        }

        function trackReadingProgress() {
            const fill = document.getElementById('reading-progress-fill');
            function update() {
                const scrollable = document.documentElement.scrollHeight - window.innerHeight;
                const ratio = scrollable > 0 ? window.scrollY / scrollable : 0;
                fill.style.width = Math.min(100, Math.max(0, ratio * 100)) + '%';
            }
            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update);
            update();
        }

        if (!postFile) {
            // No ?post= given — send the visitor to the blog index instead of
            // guessing a slug.
            window.location.replace('../blog.html');
        } else if (!isSafeSlug(postFile)) {
            showError('Invalid article identifier.');
        } else if (typeof marked === 'undefined') {
            showError('Failed to load the Markdown renderer. Please check your network connection.');
        } else {
            const markdownPath = new URL('posts/' + postFile + '.md', window.location.href).href;

            fetch(markdownPath)
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('Article not found');
                    }
                    return response.text();
                })
                .then(function (markdown) {
                    const frontMatterRegex = /^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/;
                    const match = markdown.match(frontMatterRegex);

                    let title = '';
                    let date = '';
                    let content = markdown;

                    if (match) {
                        const frontMatter = match[1];
                        content = match[2];

                        const titleMatch = frontMatter.match(/title:\s*(.+)/);
                        const dateMatch = frontMatter.match(/date:\s*(.+)/);

                        if (titleMatch) title = titleMatch[1].trim();
                        if (dateMatch) date = formatDate(dateMatch[1].trim());
                    } else {
                        const lines = markdown.split('\n');
                        if (lines[0].startsWith('# ')) {
                            title = lines[0].substring(2).trim();
                            content = lines.slice(1).join('\n');
                        }
                    }

                    document.getElementById('loading').hidden = true;

                    const container = document.getElementById('article-container');
                    container.hidden = false;

                    if (title) {
                        document.getElementById('article-title').textContent = title;
                        document.title = title + ' - Yuhang Zhang';
                    }

                    if (date) {
                        document.getElementById('article-date').textContent = date;
                    }

                    const body = document.getElementById('article-content');
                    body.innerHTML = marked.parse(content);

                    const minutes = readingTime(body.innerText || '');
                    const reading = document.getElementById('article-reading');
                    reading.textContent = minutes;
                    reading.hidden = false;
                    if (date) document.getElementById('article-sep').hidden = false;

                    trackReadingProgress();
                })
                .catch(function (error) {
                    showError('Error loading article. Please check if the file exists.');
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
