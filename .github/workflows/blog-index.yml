name: Rebuild blog index

# Regenerates blog/index.json from blog/posts/*.md + blog/plan.json whenever a
# post is added or edited — including edits made from Pages CMS on a phone.

on:
  push:
    branches: [main]
    paths:
      - 'blog/posts/**'
      - 'blog/plan.json'
      - 'scripts/build_index.py'
      - '.github/workflows/blog-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A push made with the default GITHUB_TOKEN does NOT trigger other
          # workflows, so GitHub Pages would not redeploy after this commit.
          # Add a fine-grained PAT (contents: write) as the BLOG_INDEX_TOKEN
          # secret and this checkout will use it instead, making the Pages
          # deploy fire normally.
          token: ${{ secrets.BLOG_INDEX_TOKEN || github.token }}

      - name: Build index
        run: python3 scripts/build_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- blog/index.json; then
            echo "blog/index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.json
          git commit -m "chore(blog): rebuild index [skip ci]"
          git push
